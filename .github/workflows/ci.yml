name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Holiday engine tests, packaging checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Holiday + palette engine tests (node --test)
        run: node --test frontend/tests/holidays.test.mts frontend/tests/palettes.test.mts
      - name: Logos are up to date
        run: node branding/build-logos.mjs && git diff --exit-code -- frontend/src/resources/block-master
      - name: docker compose config
        run: |
          cp .env.example .env
          docker compose config --quiet
          printf 'BLOCKMASTER_BACKEND_IMAGE=x\nBLOCKMASTER_DB_IMAGE=y\nDB_PASSWORD=a\nDB_ROOT_PASSWORD=b\nCORE_RPC_PASSWORD=c\n' > /tmp/bm.env
          docker compose --env-file /tmp/bm.env -f mynode/blockmaster/app_data/docker-compose.yml config --quiet
      - name: Shell scripts parse
        run: for f in mynode/*.sh mynode/blockmaster/scripts/*.sh mynode/blockmaster/app_data/run.sh scripts/*.sh; do bash -n "$f"; done

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --omit=optional --no-audit --no-fund
        env:
          CYPRESS_INSTALL_BINARY: 0
      - run: cp mempool-frontend-config.sample.json mempool-frontend-config.json
      - run: npm run lint
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
