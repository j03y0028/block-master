server {
    listen 4091 ssl;
    server_name blockmaster;

    include /etc/nginx/mynode/mynode_ssl_params.conf;
    include /etc/nginx/mynode/mynode_ssl_cert_key.conf;

    access_log /var/log/nginx/access_blockmaster.log;
    error_log /var/log/nginx/error_blockmaster.log;

    location / {
        proxy_pass http://127.0.0.1:4090;
        include /etc/nginx/mynode/mynode_ssl_proxy_params.conf;
    }
    # live updates (WebSocket)
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:4090/api/v1/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
